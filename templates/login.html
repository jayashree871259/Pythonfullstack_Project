<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Learning System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f4f6f9; min-height: 100vh; display: flex; flex-direction: column; }
        .navbar { background: #2c3e50; color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
        .navbar a { color: white; text-decoration: none; margin-left: 15px; font-weight: bold; }
        .navbar a:hover { color: #f1c40f; }
        .center { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .card h2 { color: #2c3e50; margin-bottom: 20px; }
        .card input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; outline: none; }
        .card input:focus { border-color: #3498db; }
        .card button { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .card button:hover { background: #2980b9; }
        .card p { margin-top: 15px; color: #555; }
        .card a { color: #3498db; font-weight: bold; text-decoration: none; }
        .error { color: red; margin-bottom: 12px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="navbar">
        <div><b>🎓 AI Learning System</b></div>
        <div>
            <a href="/">Home</a>
            <a href="/courses/">Courses</a>
            <a href="/register/">Register</a>
        </div>
    </div>

    <div class="center">
        <div class="card">
            <h2>Login 🔐</h2>

            {% if messages %}
                {% for m in messages %}
                    <p class="error">{{ m }}</p>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>

            <p>New user? <a href="/register/">Register Here</a></p>
            <p><a href="/">← Back to Home</a></p>
        </div>
    </div>

</body>
</html>
